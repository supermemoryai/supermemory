[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supermemory-strands"
version = "0.1.0"
description = "Supermemory memory store for Strands Agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["strands", "strands-agents", "agents", "ai", "memory", "supermemory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.45.0",
    "supermemory>=5,<6",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[project.urls]
Homepage = "https://supermemory.ai"
Repository = "https://github.com/supermemoryai/supermemory/tree/main/packages/strands-python"
Documentation = "https://supermemory.ai/docs"
Issues = "https://github.com/supermemoryai/supermemory/issues"

[tool.hatch.build]
include = ["src/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/supermemory_strands"]

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
