[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supermemory-livekit"
version = "0.1.0"
description = "Supermemory integration for LiveKit Agents — persistent memory for voice AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Supermemory", email = "support@supermemory.ai" }
]
keywords = [
    "supermemory",
    "livekit",
    "memory",
    "voice-ai",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "livekit-agents>=1.2.0,<2",
    "pydantic>=2.10.0",
    "supermemory>=3.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
]

[project.urls]
Homepage = "https://supermemory.ai"
Documentation = "https://supermemory.ai/docs/integrations/livekit"
Repository = "https://github.com/supermemoryai/supermemory"

[tool.hatch.build.targets.wheel]
packages = ["src/supermemory_livekit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]
